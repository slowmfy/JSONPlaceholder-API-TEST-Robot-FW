# Configuration de Robot Framework lue par RobotCode :
#   - l'extension VS Code (boutons ▶ dans l'éditeur et vue « Testing ») ;
#   - la commande « robotcode robot » (même exécution en ligne de commande).
# La commande « robot » classique ne lit pas ce fichier : voir le README.

name = "JSONPlaceholder API"
paths = ["tests"]
output-dir = "results"
console-colors = "on"

# Profils : robotcode -p <nom> robot
[profiles.smoke]
description = "Tests rapides de bon fonctionnement (tag smoke)"
includes = ["smoke"]

[profiles.erreurs]
description = "Cas d'erreur uniquement (tag erreur)"
includes = ["erreur"]

[profiles.jsonplaceholder]
description = "API JSONPlaceholder uniquement, sans l'application web"
includes = ["jsonplaceholder"]

[profiles.web]
description = "Application web : API FastAPI et interface Angular"
includes = ["web"]

[profiles.ui]
description = "Interface Angular uniquement (navigateur)"
includes = ["ui"]

[profiles.invisible]
description = "A combiner avec un autre profil : navigateur masqué (-p ui -p invisible)"
variables = { HEADLESS = "True" }
